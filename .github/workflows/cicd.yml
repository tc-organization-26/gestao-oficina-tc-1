name: CI/CD - Oficina API
on:
  pull_request:
  push:
    branches: [main, homologacao]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: oficina-api-${{ github.ref_name }}
  cancel-in-progress: false
env:
  REGISTRY: ghcr.io
  DEPLOY_ENV: ${{ github.ref_name == 'main' && 'prod' || 'hom' }}
jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oficina_db_2
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: oficina_local_password
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d oficina_db_2"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: chmod +x mvnw
      - run: ./mvnw -B clean verify

  publicar:
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'homologacao')
    needs: [testes, validar-observabilidade]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}

  deploy:
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'homologacao')
    needs: publicar
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'producao' || 'homologacao' }}
      url: ${{ steps.endpoint.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar configuracao da observabilidade
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          DD_NOTIFICATION_TARGET: ${{ vars.DD_NOTIFICATION_TARGET }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        shell: bash
        run: |
          for name in DD_API_KEY DD_APP_KEY DD_NOTIFICATION_TARGET TF_STATE_BUCKET; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure $name no Environment deste deploy."
              exit 1
            fi
          done
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.17.3
      - name: Configurar cluster e segredos
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        shell: bash
        run: |
          prefix="/oficina/${DEPLOY_ENV}"
          cluster_name="$(aws ssm get-parameter --name "$prefix/eks/cluster-name" --query 'Parameter.Value' --output text)"
          db_host="$(aws ssm get-parameter --name "$prefix/database/endpoint" --query 'Parameter.Value' --output text)"
          db_name="$(aws ssm get-parameter --name "$prefix/database/name" --query 'Parameter.Value' --output text)"
          db_secret_arn="$(aws ssm get-parameter --name "$prefix/database/master-secret-arn" --query 'Parameter.Value' --output text)"
          db_secret="$(aws secretsmanager get-secret-value --secret-id "$db_secret_arn" --query SecretString --output text)"
          auth_secret="$(aws secretsmanager get-secret-value --secret-id "oficina-${DEPLOY_ENV}/auth" --query SecretString --output text)"
          aws eks update-kubeconfig --name "$cluster_name" --region "${{ vars.AWS_REGION || 'us-east-1' }}"
          kubectl apply -f k8s/cloud/namespace.yaml
          kubectl -n oficina create configmap oficina-api-config \
            --from-literal=SERVER_PORT=8081 \
            --from-literal=SPRING_DATASOURCE_URL="jdbc:postgresql://${db_host}:5432/${db_name}" \
            --from-literal=SPRING_JPA_HIBERNATE_DDL_AUTO=none \
            --from-literal=SPRING_FLYWAY_BASELINE_ON_MIGRATE=true \
            --from-literal=SPRING_FLYWAY_BASELINE_VERSION=0 \
            --from-literal=SPRING_FLYWAY_VALIDATE_ON_MIGRATE=true \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n oficina create secret generic oficina-api-secret \
            --from-literal=SPRING_DATASOURCE_USERNAME="$(jq -r .username <<<"$db_secret")" \
            --from-literal=POSTGRES_PASSWORD="$(jq -r .password <<<"$db_secret")" \
            --from-literal=SECURITY_JWT_SECRET="$(jq -r .jwtSecret <<<"$auth_secret")" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n oficina create secret docker-registry ghcr-credentials \
            --docker-server=ghcr.io --docker-username="$GHCR_USERNAME" --docker-password="$GHCR_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Instalar observabilidade no cluster existente
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_SITE: ${{ vars.DD_SITE || 'datadoghq.com' }}
          DD_OPERATOR_CHART_VERSION: '2.31.0'
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: bash scripts/ci/install-datadog.sh
      - name: Implantar aplicacao
        run: |
          kubectl patch --local -f k8s/cloud/deployment.yaml --type merge \
            -p '{"spec":{"template":{"metadata":{"labels":{"tags.datadoghq.com/env":"${{ env.DEPLOY_ENV }}","tags.datadoghq.com/version":"${{ github.sha }}"}}}}}' \
            -o yaml > /tmp/oficina-deployment.yaml
          kubectl set image --local -f /tmp/oficina-deployment.yaml \
            oficina-api="${{ needs.publicar.outputs.image }}" -o yaml | kubectl apply -f -
          kubectl apply -f k8s/cloud/service.yaml -f k8s/cloud/hpa.yaml
          kubectl rollout status deployment/oficina-api -n oficina --timeout=300s
      - name: Registrar URL do deploy
        id: endpoint
        shell: bash
        run: |
          prefix="/oficina/${DEPLOY_ENV}"
          api_id="$(aws ssm get-parameter --name "$prefix/edge/http-api-id" --query 'Parameter.Value' --output text)"
          url="https://${api_id}.execute-api.${{ vars.AWS_REGION || 'us-east-1' }}.amazonaws.com"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "## Deploy concluido"
            echo "- API: $url"
            echo "- Swagger: $url/swagger-ui/index.html"
            echo "- OpenAPI: $url/v3/api-docs"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validar readiness publico
        env:
          PUBLIC_API_URL: ${{ steps.endpoint.outputs.url }}
        run: |
          if ! curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors \
            --connect-timeout 10 --max-time 20 \
            "$PUBLIC_API_URL/actuator/health/readiness" -o /tmp/oficina-health.json; then
            echo "::error::Readiness publico indisponivel. Confira o app e o deploy previo de oficina-auth-lambda."
            exit 1
          fi
          jq -e '.status == "UP"' /tmp/oficina-health.json
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.15.9" }
      - name: Aplicar dashboard, metricas e alertas
        working-directory: observability/datadog
        env:
          TF_IN_AUTOMATION: 'true'
          TF_INPUT: 'false'
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          TF_VAR_environment: ${{ env.DEPLOY_ENV }}
          TF_VAR_datadog_api_url: ${{ vars.DD_API_URL || 'https://api.datadoghq.com/' }}
          TF_VAR_notification_target: ${{ vars.DD_NOTIFICATION_TARGET }}
          TF_VAR_enable_synthetics: ${{ vars.DD_ENABLE_SYNTHETICS || 'false' }}
          TF_VAR_public_health_url: ${{ steps.endpoint.outputs.url }}/actuator/health/readiness
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=oficina/observability/${DEPLOY_ENV}.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" -backend-config="use_lockfile=true"
          terraform plan -input=false -lock-timeout=5m -out=tfplan
          terraform apply -input=false -lock-timeout=5m tfplan
          echo "- Datadog: $(terraform output -raw dashboard_url)" >> "$GITHUB_STEP_SUMMARY"

  validar-observabilidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.15.9" }
      - name: Validar scripts e Terraform sem credenciais
        run: |
          bash -n scripts/ci/install-datadog.sh
          terraform -chdir=observability/datadog fmt -check -recursive
          terraform -chdir=observability/datadog init -backend=false -input=false -lockfile=readonly
          terraform -chdir=observability/datadog validate
