spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/${POSTGRES_DB:oficina_db_2}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:oficina_local_password}

security.jwt.secret=${JWT_SECRET:${SECURITY_JWT_SECRET:oficina-local-jwt-secret-key-change-me-32-bytes}}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
