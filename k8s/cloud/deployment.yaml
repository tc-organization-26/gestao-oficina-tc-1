apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  namespace: oficina
spec:
  replicas: 2
  selector:
    matchLabels: { app: oficina-api }
  template:
    metadata:
      labels:
        app: oficina-api
        tags.datadoghq.com/service: oficina-api
      annotations:
        ad.datadoghq.com/oficina-api.logs: '[{"source":"java","service":"oficina-api"}]'
        ad.datadoghq.com/oficina-api.checks: |
          {"http_check":{"init_config":{},"instances":[{"name":"oficina-api-readiness","url":"http://%%host%%:8081/actuator/health/readiness","timeout":5,"tags":["service:oficina-api"]}]}}
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: oficina-api
          image: ghcr.io/substituir/oficina-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef: { name: oficina-api-config }
            - secretRef: { name: oficina-api-secret }
          env:
            - name: DD_SERVICE
              value: oficina-api
            - name: DD_ENV
              valueFrom:
                fieldRef: { fieldPath: "metadata.labels['tags.datadoghq.com/env']" }
            - name: DD_VERSION
              valueFrom:
                fieldRef: { fieldPath: "metadata.labels['tags.datadoghq.com/version']" }
            - name: DD_LOGS_INJECTION
              value: "true"
            - name: DD_RUNTIME_METRICS_ENABLED
              value: "true"
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 500m, memory: 768Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            periodSeconds: 20
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            periodSeconds: 10
            failureThreshold: 30

