apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  namespace: oficina
spec:
  replicas: 2
  selector:
    matchLabels: { app: oficina-api }
  template:
    metadata:
      labels: { app: oficina-api }
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: oficina-api
          image: ghcr.io/substituir/oficina-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef: { name: oficina-api-config }
            - secretRef: { name: oficina-api-secret }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 500m, memory: 768Mi }
          readinessProbe:
            tcpSocket: { port: 8081 }
            initialDelaySeconds: 45
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8081 }
            initialDelaySeconds: 75
            periodSeconds: 20

